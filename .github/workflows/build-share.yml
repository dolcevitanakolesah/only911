name: Build share previews

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "car/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate car pages
        run: python3 build_share.py "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A car index.html
          git diff --cached --quiet || (git commit -m "Update share previews" && git push)
