name: Build share previews

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "car/**"
      - "assets/**/*-og.jpg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Generate share pages and preview images
        run: python3 build_share.py "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A car assets index.html
          git diff --cached --quiet || (git commit -m "Update share previews" && git push)
