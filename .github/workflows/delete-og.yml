# One-time cleanup: deletes every assets/<car-folder>/<car-folder>-og.jpg and commits the deletion.
# Run it by hand: Actions tab > "Delete og.jpg files" > Run workflow.
# It never touches assets/Home/opengraph.jpg. You can delete this file afterwards.
name: Delete og.jpg files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete the files
        run: |
          echo "Files to delete:"
          find assets -mindepth 2 -maxdepth 2 -type f -name '*-og.jpg' -not -path 'assets/Home/*' | sort
          find assets -mindepth 2 -maxdepth 2 -type f -name '*-og.jpg' -not -path 'assets/Home/*' -delete

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to delete."
            exit 0
          fi
          git commit -m "Delete -og.jpg files"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
